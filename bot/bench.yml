# /bench on a pull request -> the benchmarking service.
#
# Copy this file into the fork's .github/workflows/ (the v1 prototype targets
# the ocaml/ocaml fork, Q11).  It is a THIN client of API A: it parses nothing
# of the /bench grammar (that lives in the server) and posts back whatever
# markdown the server returns -- acknowledgement, reuse notice, help text, or
# refusal alike.
#
# Setup (see bot/README.md):
#   secrets.BENCH_BOT_CAP   base64 of the server's bot.cap capability file
#                           (bench-serve writes it into <state>/caps/)
#   vars.BENCH_CLI_URL      URL of a prebuilt linux bench-cli binary
#
# The server must be reachable from GitHub's runners at the address inside
# bot.cap (bench-serve --listen tcp:... --public-address tcp:HOST:PORT).

name: bench
on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  bench:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/bench')
    runs-on: ubuntu-latest
    steps:
      # What the webhook does not carry, the API does: the PR head at comment
      # time and the branch it targets (the server computes the merge base).
      - name: PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
          echo "head_sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .base.ref <<<"$pr")" >> "$GITHUB_OUTPUT"

      - name: fetch bench-cli
        env:
          BENCH_BOT_CAP: ${{ secrets.BENCH_BOT_CAP }}
        run: |
          curl -fsSL -o bench-cli "${{ vars.BENCH_CLI_URL }}"
          chmod +x bench-cli
          printf '%s' "$BENCH_BOT_CAP" | base64 -d > bot.cap

      - name: submit
        id: submit
        env:
          # via env, never inline: comment text is untrusted input
          COMMENT: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set +e
          out=$(./bench-cli submit "$COMMENT" \
            --cap bot.cap \
            --as-login "$AUTHOR" \
            --pr-repo "${{ github.repository }}" \
            --pr-number "${{ github.event.issue.number }}" \
            --pr-url "${{ github.event.issue.pull_request.html_url }}" \
            --comment-id "${{ github.event.comment.id }}" \
            --comment-url "${{ github.event.comment.html_url }}" \
            --head-sha "${{ steps.pr.outputs.head_sha }}" \
            --base-ref "${{ steps.pr.outputs.base_ref }}" 2>&1)
          echo "$out"
          {
            echo "reply<<BENCH_REPLY_EOF"
            echo "$out"
            echo "BENCH_REPLY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Every outcome is postable verbatim: that is the API's contract.
      - name: reply
        env:
          GH_TOKEN: ${{ github.token }}
          REPLY: ${{ steps.submit.outputs.reply }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="$REPLY"
